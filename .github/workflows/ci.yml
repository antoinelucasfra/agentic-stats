name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # Pinned: `uv export` output is compared byte for byte below.
          version: "0.9.5"
          python-version: "3.12"
      - run: uv sync --frozen --all-extras --all-groups
      # Fetch the trial now so the app import below reuses the parquet cache
      # instead of downloading a second time.
      - run: uv run python -m utils.data
      - run: uv run --all-extras ruff check .
      - run: uv run --all-extras ruff format --check .
      # Connect Cloud installs Python packages from requirements.txt, not from
      # uv.lock, so the two files must not drift. Frozen: a stale lock fails here
      # rather than being silently re-resolved.
      - run: uv export --frozen --no-dev --format requirements-txt --no-hashes --no-header --extra app | diff - requirements.txt
      # The deploy path: Connect Cloud pip-installs this exact file on Linux,
      # which the uv sync above does not exercise. This app is not a package, so
      # `app.py`, `web/`, `stats/` and `utils/` come from the checkout, and the
      # import runs from the repository root, as it does on the platform.
      - run: |
          uv venv /tmp/cc
          uv pip install --python /tmp/cc/bin/python -r requirements.txt
          /tmp/cc/bin/python -c "import app, web.app_ui, web.server; print(type(app.app).__name__)"
      # test_app.py drives the real server in memory: the generated Playground
      # form, a tool run, an upload and the error paths. test_registry.py checks
      # the MCP surface against the registry the app reads, so the two cannot drift.
      - run: uv run --all-extras pytest -q
