name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Opens (or updates) a release PR. Merging it bumps pyproject.toml, writes
      # CHANGELOG.md, and creates the tag and GitHub Release, which triggers
      # `release.yml`.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
