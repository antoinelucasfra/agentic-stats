[project]
name = "agentic-stats"
version = "0.1.0"
description = "MCP server + FastAPI app exposing statistical analysis of an R&D design-of-experiments dataset to LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.2",
    "pandas>=2.2",
    "pydantic>=2.9",
    "statsmodels>=0.14",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
agentic-stats-api = "agentic_stats.api:main"
agentic-stats-mcp = "agentic_stats.mcp_server:main"
agentic-stats-agent = "agentic_stats.agent:main"

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_stats"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
