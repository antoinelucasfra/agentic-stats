[project]
name = "agentic-stats"
version = "0.1.0"
description = "Shiny app, MCP server and CLI agent exposing statistical analysis of a real agronomy split-plot trial to LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # duckdb fetches the dataset over HTTPS, writes the parquet cache and reads it.
    "duckdb>=1.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "patsy>=0.5",
    "pydantic>=2.9",
    "scipy>=1.11",
    "shiny>=1.8.0",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# The statistics core needs no web server; each transport lives in an extra so
# the MCP server and the CLI do not drag Shiny in.
# Floor is 2.2, not 1.2: `mcp.server.mcpserver.MCPServer` does not exist in 1.x.
mcp = ["mcp>=2.2"]
agent = ["httpx>=0.27"]
# The Shiny UI and the chat model it talks to. `shiny` brings shinychat in.
app = [
    "chatlas>=0.11",
    "plotnine>=0.13",
    "shiny>=1.0",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3", "ruff>=0.8"]

# This is an application, not a distributable package: `app.py` runs from the
# checkout, so uv manages a virtual environment instead of installing the project.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
